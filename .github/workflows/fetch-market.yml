name: Atualizar dados de mercado (brapi.dev)

on:
  schedule:
    # 08:00 horário de Brasília (11:00 UTC), dias úteis
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados na brapi.dev
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/fetch-market.mjs

      - name: Commit e push se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/market.json
          git diff --staged --quiet || git commit -m "chore: atualiza dados de mercado (brapi.dev)"
          git push
